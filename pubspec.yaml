name: iqs_flutter
description: "IQS — Iraqi Sports App. Claymorphism UI built from the design mockups."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Tajawal font (weights 400/500/700/800/900) is fetched at runtime.
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  dio: ^5.9.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  image_picker: ^1.2.2
  qr_flutter: ^4.1.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/iqs-logo.jpeg
    - assets/footer-field.png
    - assets/header-banner.png
    - assets/club-crest.png
    - assets/news-messi.png
