<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  .iqs-scroll::-webkit-scrollbar { display: none; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; font-family:'Tajawal',sans-serif; background:linear-gradient(160deg,#56b277 0%,#3f9e63 55%,#2f8a52 100%);">

  <!-- Phone bezel -->
  <div style="position:relative; width:392px; height:820px; border-radius:56px; padding:13px; background:linear-gradient(145deg,#11131a,#2b2f3a); box-shadow:0 40px 80px -20px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.05) inset;">

    <!-- Screen -->
    <div dir="rtl" style="position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#ffffff; display:flex; flex-direction:column;">

      <!-- Scroll area -->
      <div class="iqs-scroll" style="flex:1 1 auto; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;">

        <!-- ===== GREEN HEADER ===== -->
        <div style="position:relative; padding-bottom:54px; border-radius:0 0 38px 38px; overflow:hidden; background:linear-gradient(165deg,#3fa564 0%,#2f9355 55%,#23823f 100%);">

          <!-- Stadium banner -->
          <img src="assets/header-banner.png" alt="" style="position:absolute; top:0; left:0; width:100%; height:230px; object-fit:cover; opacity:.22; mix-blend-mode:luminosity; pointer-events:none;">
          <!-- Soccer ball watermark -->
          <svg viewBox="0 0 100 100" style="position:absolute; top:96px; left:18px; width:150px; height:150px; opacity:.10; pointer-events:none;"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M50 24 L62 33 L57 48 L43 48 L38 33 Z M50 24 L74 28 M62 33 L70 56 M43 48 L30 56 M38 33 L26 28 M74 28 L80 44 L70 56 M26 28 L20 44 L30 56 M30 56 L37 72 L50 70 L63 72 L70 56" fill="none" stroke="#fff" stroke-width="2.2"/></svg>

          <!-- Status bar -->
          <div dir="ltr" style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:18px 30px 4px;">
            <span style="font-size:16px; font-weight:700; color:#fff; letter-spacing:.5px;">9:41</span>
            <div style="display:flex; align-items:center; gap:7px; color:#fff;">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.7l1.2-1.3C14.4 1.4 11.6.2 8.5.2S2.6 1.4.5 3.6l1.2 1.3C3.5 3.2 5.9 2.2 8.5 2.2z"/><path d="M8.5 5.6c1.6 0 3.1.6 4.2 1.7l1.2-1.3C12.5 4.6 10.6 3.8 8.5 3.8S4.5 4.6 3.1 6l1.2 1.3C5.4 6.2 6.9 5.6 8.5 5.6z"/><circle cx="8.5" cy="9.8" r="1.8"/></svg>
              <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="2.8" y="2.8" width="17" height="7.4" rx="1.6" fill="currentColor"/><rect x="24" y="4.2" width="1.8" height="4.6" rx=".9" fill="currentColor" opacity=".55"/></svg>
            </div>
          </div>

          <!-- Top bar: back + title + stories badge -->
          <div style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:8px 22px 0;">
            <div style="padding:9px 20px; border-radius:16px; font-size:15px; font-weight:700; color:#fff; background:linear-gradient(180deg,#46ad6b,#2c8a4f); box-shadow:0 6px 12px -4px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.22);">قصص</div>
            <h1 style="margin:0; font-size:24px; font-weight:800; color:#fff;">الزوراء</h1>
            <a href="IQS Welcome.dc.html" style="width:46px; height:46px; border-radius:16px; text-decoration:none; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#46ad6b,#2c8a4f); box-shadow:0 6px 12px -4px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.22); transition:transform .1s ease;" style-active="transform:scale(.92);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
          </div>

          <!-- Crest -->
          <div style="position:relative; display:flex; justify-content:center; margin-top:14px;">
            <img src="assets/club-crest.png" alt="نادي الزوراء" style="width:180px; height:180px; object-fit:contain; filter:drop-shadow(0 12px 18px rgba(0,0,0,.3));">
          </div>
        </div>

        <!-- ===== INFO CARD ===== -->
        <div style="margin:-32px 22px 0; position:relative; z-index:2; background:linear-gradient(180deg,#ffffff,#fafdfb); border-radius:24px; padding:20px 14px; display:flex; align-items:stretch; border:1px solid rgba(31,128,64,.07); box-shadow:0 10px 26px rgba(28,80,48,.13), 0 -3px 12px rgba(28,80,48,.04), 0 2px 6px rgba(28,80,48,.06), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -4px 9px rgba(28,80,48,.05);">
          <div style="flex:1; text-align:center;">
            <div style="font-size:13px; font-weight:500; color:#9aa69f; margin-bottom:6px;">الملعب</div>
            <div style="font-size:16px; font-weight:800; color:#1f8a45;">ملعب الزوراء</div>
          </div>
          <div style="width:1px; background:#e9eee9;"></div>
          <div style="flex:1; text-align:center;">
            <div style="font-size:13px; font-weight:500; color:#9aa69f; margin-bottom:6px;">المدينة</div>
            <div style="font-size:16px; font-weight:800; color:#1f8a45;">بغداد</div>
          </div>
          <div style="width:1px; background:#e9eee9;"></div>
          <div style="flex:1; text-align:center;">
            <div style="font-size:13px; font-weight:500; color:#9aa69f; margin-bottom:6px;">تأسس</div>
            <div style="font-size:16px; font-weight:800; color:#1f8a45;">1969</div>
          </div>
        </div>

        <!-- ===== TAB PILLS ===== -->
        <div class="iqs-scroll" style="margin:20px 22px 8px; padding:11px; border-radius:22px; background:linear-gradient(180deg,#ffffff,#f1f6f2); display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; border:1px solid rgba(31,128,64,.08); box-shadow:0 16px 30px -8px rgba(28,80,48,.22), 0 6px 14px -4px rgba(28,80,48,.14), 0 -3px 10px rgba(28,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -4px 8px rgba(28,80,48,.06);">
          <button style="flex:none; padding:8px 15px; border:none; border-radius:12px; cursor:pointer; white-space:nowrap; font-family:'Tajawal',sans-serif; font-size:11.5px; font-weight:700; color:#fff; background:linear-gradient(180deg,#2aa153,#1d8040); box-shadow:0 6px 13px -4px rgba(29,128,64,.5), 0 -2px 6px rgba(29,128,64,.12), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.16);">نظرة عامة</button>
          <button style="flex:none; padding:8px 15px; border:none; border-radius:12px; cursor:pointer; white-space:nowrap; font-family:'Tajawal',sans-serif; font-size:11.5px; font-weight:700; color:#5d6b62; background:linear-gradient(180deg,#ffffff,#f4f8f5); border:1px solid rgba(31,128,64,.06); box-shadow:0 4px 10px rgba(28,80,48,.08), 0 -1px 4px rgba(28,80,48,.03), inset 0 2px 2px rgba(255,255,255,.95), inset 0 -2px 4px rgba(28,80,48,.04);" style-active="transform:scale(.96);">الأخبار</button>
          <button style="flex:none; padding:8px 15px; border:none; border-radius:12px; cursor:pointer; white-space:nowrap; font-family:'Tajawal',sans-serif; font-size:11.5px; font-weight:700; color:#5d6b62; background:linear-gradient(180deg,#ffffff,#f4f8f5); border:1px solid rgba(31,128,64,.06); box-shadow:0 4px 10px rgba(28,80,48,.08), 0 -1px 4px rgba(28,80,48,.03), inset 0 2px 2px rgba(255,255,255,.95), inset 0 -2px 4px rgba(28,80,48,.04);" style-active="transform:scale(.96);">المباريات</button>
          <button style="flex:none; padding:8px 15px; border:none; border-radius:12px; cursor:pointer; white-space:nowrap; font-family:'Tajawal',sans-serif; font-size:11.5px; font-weight:700; color:#5d6b62; background:linear-gradient(180deg,#ffffff,#f4f8f5); border:1px solid rgba(31,128,64,.06); box-shadow:0 4px 10px rgba(28,80,48,.08), 0 -1px 4px rgba(28,80,48,.03), inset 0 2px 2px rgba(255,255,255,.95), inset 0 -2px 4px rgba(28,80,48,.04);" style-active="transform:scale(.96);">اللاعبون</button>
          <button style="flex:none; padding:8px 15px; border:none; border-radius:12px; cursor:pointer; white-space:nowrap; font-family:'Tajawal',sans-serif; font-size:11.5px; font-weight:700; color:#5d6b62; background:linear-gradient(180deg,#ffffff,#f4f8f5); border:1px solid rgba(31,128,64,.06); box-shadow:0 4px 10px rgba(28,80,48,.08), 0 -1px 4px rgba(28,80,48,.03), inset 0 2px 2px rgba(255,255,255,.95), inset 0 -2px 4px rgba(28,80,48,.04);" style-active="transform:scale(.96);">الإحصائيات</button>
        </div>

        <!-- ===== NEWS ===== -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 24px 12px;">
          <h2 style="margin:0; font-size:19px; font-weight:800; color:#1c2620;">آخر الأخبار</h2>
          <a href="#" style="font-size:14px; font-weight:700; color:#1f8a45; text-decoration:none;">عرض الكل</a>
        </div>

        <div style="display:flex; flex-direction:column; gap:16px; padding:0 22px 8px;">

          <!-- News card 1 -->
          <div style="display:flex; gap:14px; align-items:center; background:linear-gradient(180deg,#ffffff,#fafdfb); border-radius:22px; padding:12px; cursor:pointer; border:1px solid rgba(31,128,64,.07); box-shadow:0 10px 26px rgba(28,80,48,.13), 0 -3px 12px rgba(28,80,48,.04), 0 2px 6px rgba(28,80,48,.06), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -4px 9px rgba(28,80,48,.05);" style-active="transform:scale(.985);">
            <img src="assets/news-messi.png" alt="" style="width:104px; height:78px; object-fit:cover; border-radius:16px; flex:none; box-shadow:0 4px 8px rgba(0,0,0,.15);">
            <div style="flex:1; min-width:0;">
              <p style="margin:0 0 8px; font-size:16px; font-weight:800; color:#1c2620; line-height:1.45; text-wrap:pretty;">الزوراء يتفوق على القوة الجوية في ديربي بغداد</p>
              <span style="font-size:13px; font-weight:500; color:#9aa69f;">منذ ساعتين</span>
            </div>
          </div>

          <!-- News card 2 -->
          <div style="display:flex; gap:14px; align-items:center; background:linear-gradient(180deg,#ffffff,#fafdfb); border-radius:22px; padding:12px; cursor:pointer; border:1px solid rgba(31,128,64,.07); box-shadow:0 10px 26px rgba(28,80,48,.13), 0 -3px 12px rgba(28,80,48,.04), 0 2px 6px rgba(28,80,48,.06), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -4px 9px rgba(28,80,48,.05);" style-active="transform:scale(.985);">
            <img src="assets/news-messi.png" alt="" style="width:104px; height:78px; object-fit:cover; border-radius:16px; flex:none; box-shadow:0 4px 8px rgba(0,0,0,.15);">
            <div style="flex:1; min-width:0;">
              <p style="margin:0 0 8px; font-size:16px; font-weight:800; color:#1c2620; line-height:1.45; text-wrap:pretty;">المدرب: هدفنا هو حصد جميع البطولات هذا الموسم</p>
              <span style="font-size:13px; font-weight:500; color:#9aa69f;">منذ 5 ساعات</span>
            </div>
          </div>
        </div>

        <div style="height:18px;"></div>
      </div>

      <!-- ===== BOTTOM NAV ===== -->
      <div style="flex:none; display:flex; align-items:flex-end; justify-content:space-around; padding:14px 16px 22px; background:#ffffff; box-shadow:0 -8px 22px -12px rgba(28,80,48,.18);">

        <!-- Home active -->
        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:7px; font-family:'Tajawal',sans-serif;">
          <span style="width:52px; height:46px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#2aa153,#1d8040); box-shadow:0 8px 14px -5px rgba(29,128,64,.55), inset 0 2px 2px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.18);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          </span>
          <span style="font-size:12px; font-weight:700; color:#1f8a45;">الرئيسية</span>
        </button>

        <!-- Matches -->
        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v3a6 6 0 0 1-12 0z"/><path d="M6 5H4a2 2 0 0 0 0 4h2M18 5h2a2 2 0 0 1 0 4h-2"/><path d="M12 13v3M9 20h6M10 20v-2.5h4V20"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">المباريات</span>
        </button>

        <!-- News -->
        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الأخبار</span>
        </button>

        <!-- Video -->
        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><polygon points="10 9 15 12 10 15" fill="#9aa69f" stroke="none"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الفيديو</span>
        </button>

        <!-- More -->
        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#9aa69f"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">المزيد</span>
        </button>
      </div>

    </div>

    <!-- Notch -->
    <div style="position:absolute; top:13px; left:50%; transform:translateX(-50%); width:150px; height:30px; background:#11131a; border-radius:0 0 18px 18px; z-index:5;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:472,&quot;height&quot;:900}}"></script>
</body>
</html>
