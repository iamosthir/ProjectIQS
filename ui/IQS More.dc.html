            <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:472,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { notif: true, dark: false };

  renderVals() {
    const onTrack = "linear-gradient(180deg,#2aa153,#1d8040)";
    const offTrack = "linear-gradient(180deg,#dfe6e0,#cfd8d1)";
    const onShadow = "inset 0 2px 4px rgba(0,0,0,.2), inset 0 -1px 2px rgba(255,255,255,.25)";
    const offShadow = "inset 0 2px 4px rgba(0,0,0,.14)";
    return {
      toggleNotif: () => this.setState(s => ({ notif: !s.notif })),
      toggleDark: () => this.setState(s => ({ dark: !s.dark })),
      notifTrack: this.state.notif ? onTrack : offTrack,
      notifTrackShadow: this.state.notif ? onShadow : offShadow,
      notifKnob: this.state.notif ? "23px" : "3px",
      darkTrack: this.state.dark ? onTrack : offTrack,
      darkTrackShadow: this.state.dark ? onShadow : offShadow,
      darkKnob: this.state.dark ? "23px" : "3px",
    };
  }
}
</script>
