<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  .iqs-scroll::-webkit-scrollbar { display: none; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; font-family:'Tajawal',sans-serif; background:linear-gradient(160deg,#56b277 0%,#3f9e63 55%,#2f8a52 100%);">

  <!-- Phone bezel -->
  <div style="position:relative; width:392px; height:820px; border-radius:56px; padding:13px; background:linear-gradient(145deg,#11131a,#2b2f3a); box-shadow:0 40px 80px -20px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.05) inset;">

    <!-- Screen -->
    <div dir="rtl" style="position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#eef3ee; display:flex; flex-direction:column;">

      <!-- Scroll area -->
      <div class="iqs-scroll" style="flex:1 1 auto; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;">

        <!-- ===== GREEN HEADER ===== -->
        <div style="position:relative; padding-bottom:14px; border-radius:0 0 36px 36px; overflow:hidden; background:linear-gradient(165deg,#42a967 0%,#319457 55%,#23823f 100%); box-shadow:0 14px 30px -10px rgba(28,90,50,.45);">

          <svg viewBox="0 0 100 100" style="position:absolute; top:30px; left:-30px; width:160px; height:160px; opacity:.08; pointer-events:none;"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M50 24 L62 33 L57 48 L43 48 L38 33 Z M50 24 L74 28 M62 33 L70 56 M43 48 L30 56 M38 33 L26 28 M74 28 L80 44 L70 56 M26 28 L20 44 L30 56 M30 56 L37 72 L50 70 L63 72 L70 56" fill="none" stroke="#fff" stroke-width="2.2"/></svg>

          <!-- Status bar -->
          <div dir="ltr" style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:16px 30px 4px;">
            <span style="font-size:16px; font-weight:700; color:#fff; letter-spacing:.5px;">9:41</span>
            <div style="display:flex; align-items:center; gap:7px; color:#fff;">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.7l1.2-1.3C14.4 1.4 11.6.2 8.5.2S2.6 1.4.5 3.6l1.2 1.3C3.5 3.2 5.9 2.2 8.5 2.2z"/><path d="M8.5 5.6c1.6 0 3.1.6 4.2 1.7l1.2-1.3C12.5 4.6 10.6 3.8 8.5 3.8S4.5 4.6 3.1 6l1.2 1.3C5.4 6.2 6.9 5.6 8.5 5.6z"/><circle cx="8.5" cy="9.8" r="1.8"/></svg>
              <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="2.8" y="2.8" width="17" height="7.4" rx="1.6" fill="currentColor"/><rect x="24" y="4.2" width="1.8" height="4.6" rx=".9" fill="currentColor" opacity=".55"/></svg>
            </div>
          </div>

          <!-- Top row -->
          <div style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:8px 22px 4px;">
            <button style="width:50px; height:50px; border:none; border-radius:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#4cb472,#2c8a4f); box-shadow:0 8px 16px -5px rgba(0,0,0,.35), 0 -2px 6px rgba(255,255,255,.12), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -4px 7px rgba(0,0,0,.25); transition:transform .1s ease;" style-active="transform:scale(.92);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>

            <h1 style="margin:0; font-size:24px; font-weight:800; color:#fff;">المباريات</h1>

            <button style="position:relative; width:50px; height:50px; border:none; border-radius:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#4cb472,#2c8a4f); box-shadow:0 8px 16px -5px rgba(0,0,0,.35), 0 -2px 6px rgba(255,255,255,.12), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -4px 7px rgba(0,0,0,.25); transition:transform .1s ease;" style-active="transform:scale(.92);">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span style="position:absolute; top:11px; right:12px; width:9px; height:9px; border-radius:50%; background:#ffd23d; border:2px solid #2c8a4f;"></span>
            </button>
          </div>

          <!-- Filter pills -->
          <div class="iqs-scroll" style="position:relative; margin:8px 18px 2px; padding:9px; border-radius:20px; background:linear-gradient(180deg,#ffffff,#f1f6f2); display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; border:1px solid rgba(255,255,255,.6); box-shadow:0 12px 24px -8px rgba(20,70,40,.35), 0 5px 10px -4px rgba(20,70,40,.2), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -4px 8px rgba(28,80,48,.07);">
            <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
              <button onClick="{{ f.select }}" style="flex:none; padding:9px 22px; border:none; border-radius:14px; cursor:pointer; white-space:nowrap; font-family:'Tajawal',sans-serif; font-size:14px; font-weight:700; color:{{ f.color }}; background:{{ f.bg }}; box-shadow:{{ f.shadow }}; transition:background .15s ease, box-shadow .15s ease, transform .15s ease;">{{ f.label }}</button>
            </sc-for>
          </div>
        </div>

        <!-- ===== TODAY ===== -->
        <h2 style="margin:0; padding:22px 24px 4px; font-size:18px; font-weight:800; color:#1c2620;">اليوم</h2>
        <div style="display:flex; flex-direction:column; gap:16px; padding:12px 18px 0;">
          <sc-for list="{{ todayMatches }}" as="m" hint-placeholder-count="3">
            <div style="display:flex; align-items:center; justify-content:space-between; background:linear-gradient(180deg,#ffffff,#fafdfb); border-radius:24px; padding:20px 16px; border:1px solid rgba(31,128,64,.08); box-shadow:0 16px 30px -10px rgba(28,80,48,.2), 0 7px 14px -5px rgba(28,80,48,.12), 0 -3px 10px rgba(28,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -5px 10px rgba(28,80,48,.06);">

              <!-- home (right) -->
              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:11px;">
                <div data-color="{{ m.homeColor }}" style="width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#16357a; box-shadow:0 8px 14px -4px rgba(20,40,70,.4), 0 -2px 5px rgba(255,255,255,.5), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -4px 7px rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.85);">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.4"/><path d="M12 6.5l1.4 3 3.2.3-2.4 2.1.7 3.1L12 16.4l-2.9 1.7.7-3.1L7.4 9.8l3.2-.3z" fill="#fff"/></svg>
                </div>
                <span style="font-size:15px; font-weight:700; color:#1c2620; text-align:center;">{{ m.homeName }}</span>
              </div>

              <!-- center -->
              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:9px;">
                <div dir="ltr" style="font-size:30px; font-weight:900; color:#1c2620; letter-spacing:1px; white-space:nowrap;">{{ m.score }}</div>
                <span style="padding:5px 16px; border-radius:11px; font-size:13px; font-weight:700; color:#2aa153; background:#e9f5ec; box-shadow:inset 0 1px 2px rgba(42,161,83,.15);">{{ m.pill }}</span>
                <span style="font-size:13px; font-weight:600; color:#9aa69f;">{{ m.time }}</span>
              </div>

              <!-- away (left) -->
              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:11px;">
                <div data-color="{{ m.awayColor }}" style="width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#1f53b0; box-shadow:0 8px 14px -4px rgba(20,40,70,.4), 0 -2px 5px rgba(255,255,255,.5), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -4px 7px rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.85);">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.4"/><path d="M12 6.5l1.4 3 3.2.3-2.4 2.1.7 3.1L12 16.4l-2.9 1.7.7-3.1L7.4 9.8l3.2-.3z" fill="#fff"/></svg>
                </div>
                <span style="font-size:15px; font-weight:700; color:#1c2620; text-align:center;">{{ m.awayName }}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- ===== TOMORROW ===== -->
        <h2 style="margin:0; padding:24px 24px 4px; font-size:18px; font-weight:800; color:#1c2620;">غداً</h2>
        <div style="display:flex; flex-direction:column; gap:16px; padding:12px 18px 0;">
          <sc-for list="{{ tomorrowMatches }}" as="m" hint-placeholder-count="1">
            <div style="display:flex; align-items:center; justify-content:space-between; background:linear-gradient(180deg,#ffffff,#fafdfb); border-radius:24px; padding:20px 16px; border:1px solid rgba(31,128,64,.08); box-shadow:0 16px 30px -10px rgba(28,80,48,.2), 0 7px 14px -5px rgba(28,80,48,.12), 0 -3px 10px rgba(28,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -5px 10px rgba(28,80,48,.06);">

              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:11px;">
                <div data-color="{{ m.homeColor }}" style="width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#15306e; box-shadow:0 8px 14px -4px rgba(20,40,70,.4), 0 -2px 5px rgba(255,255,255,.5), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -4px 7px rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.85);">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.4"/><path d="M12 6.5l1.4 3 3.2.3-2.4 2.1.7 3.1L12 16.4l-2.9 1.7.7-3.1L7.4 9.8l3.2-.3z" fill="#fff"/></svg>
                </div>
                <span style="font-size:15px; font-weight:700; color:#1c2620; text-align:center;">{{ m.homeName }}</span>
              </div>

              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:9px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
                <div style="font-size:19px; font-weight:800; color:#33433a;">{{ m.time }}</div>
                <span style="padding:5px 16px; border-radius:11px; font-size:13px; font-weight:700; color:#2aa153; background:#e9f5ec; box-shadow:inset 0 1px 2px rgba(42,161,83,.15);">{{ m.pill }}</span>
              </div>

              <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:11px;">
                <div data-color="{{ m.awayColor }}" style="width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#e0a416; box-shadow:0 8px 14px -4px rgba(20,40,70,.4), 0 -2px 5px rgba(255,255,255,.5), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -4px 7px rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.85);">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="1.4"/><path d="M12 6.5l1.4 3 3.2.3-2.4 2.1.7 3.1L12 16.4l-2.9 1.7.7-3.1L7.4 9.8l3.2-.3z" fill="#fff"/></svg>
                </div>
                <span style="font-size:15px; font-weight:700; color:#1c2620; text-align:center;">{{ m.awayName }}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="height:16px;"></div>
      </div>

      <!-- ===== BOTTOM NAV ===== -->
      <div style="flex:none; display:flex; align-items:flex-end; justify-content:space-around; padding:14px 14px 22px; background:#ffffff; box-shadow:0 -10px 26px -12px rgba(28,80,48,.2);">

        <a href="IQS-Home.dc.html" style="border:none; cursor:pointer; text-decoration:none; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الرئيسية</span>
        </a>

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:7px; font-family:'Tajawal',sans-serif;">
          <span style="width:54px; height:46px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#2aa153,#1d8040); box-shadow:0 10px 16px -5px rgba(29,128,64,.55), 0 -2px 6px rgba(29,128,64,.15), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -4px 6px rgba(0,0,0,.18);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4.5a2 2 0 0 0 0 4H7M17 5h2.5a2 2 0 0 1 0 4H17"/><path d="M12 13v3M8.5 20h7M9.5 20v-2.5h5V20"/></svg>
          </span>
          <span style="font-size:12px; font-weight:700; color:#1f8a45;">المباريات</span>
        </button>

        <a href="IQS News.dc.html" style="border:none; cursor:pointer; text-decoration:none; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الأخبار</span>
        </a>

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><polygon points="10 9 15 12 10 15" fill="#9aa69f" stroke="none"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الفيديو</span>
        </button>

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#9aa69f"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">المزيد</span>
        </button>
      </div>

    </div>

    <!-- Notch -->
    <div style="position:absolute; top:13px; left:50%; transform:translateX(-50%); width:150px; height:30px; background:#11131a; border-radius:0 0 18px 18px; z-index:5;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:472,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { filter: "الكل" };

  filterList = ["الكل", "اليوم", "غداً", "انتهت"];

  todayData = [
    { homeName: "القوة الجوية", homeColor: "#16357a", awayName: "الزوراء", awayColor: "#1f53b0", score: "2 - 1", pill: "انتهت", time: "8:00 م" },
    { homeName: "الشرطة", homeColor: "#2a2a2a", awayName: "أربيل", awayColor: "#2f8f3e", score: "1 - 0", pill: "انتهت", time: "6:00 م" },
    { homeName: "نفط البصرة", homeColor: "#1b7a3e", awayName: "دهوك", awayColor: "#2060c0", score: "7:30 م", pill: "اليوم", time: "" },
  ];

  tomorrowData = [
    { homeName: "الطلبة", homeColor: "#15306e", awayName: "الكهرباء", awayColor: "#e0a416", time: "8:30 م", pill: "غداً" },
  ];

  componentDidMount() { this.paintCrests(); }
  componentDidUpdate() { this.paintCrests(); }

  paintCrests() {
    document.querySelectorAll('[data-color]').forEach(el => {
      const c = el.getAttribute('data-color') || '';
      if (c.startsWith('#')) el.style.background = `radial-gradient(120% 120% at 35% 25%, ${c}cc, ${c})`;
    });
  }

  renderVals() {
    const active = this.state.filter;
    return {
      todayMatches: this.todayData,
      tomorrowMatches: this.tomorrowData,
      filters: this.filterList.map(label => {
        const on = label === active;
        return {
          label,
          color: on ? "#ffffff" : "#3a6b4c",
          bg: on
            ? "linear-gradient(180deg,#2aa153,#1d8040)"
            : "linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.82))",
          shadow: on
            ? "0 8px 14px -5px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.18)"
            : "0 4px 9px -4px rgba(0,0,0,.25), inset 0 2px 2px rgba(255,255,255,.9)",
          select: () => this.setState({ filter: label }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
