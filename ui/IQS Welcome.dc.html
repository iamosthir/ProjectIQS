<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; font-family:'Tajawal',sans-serif; background:linear-gradient(160deg,#56b277 0%,#3f9e63 55%,#2f8a52 100%);">

  <!-- Phone bezel -->
  <div style="position:relative; width:392px; height:820px; border-radius:56px; padding:13px; background:linear-gradient(145deg,#11131a,#2b2f3a); box-shadow:0 40px 80px -20px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.05) inset;">

    <!-- Screen -->
    <div dir="rtl" style="position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#ffffff; display:flex; flex-direction:column;">

      <!-- Status bar -->
      <div dir="ltr" style="display:flex; align-items:center; justify-content:space-between; padding:18px 30px 4px; flex:none;">
        <span style="font-size:16px; font-weight:700; color:#11151b; letter-spacing:.5px;">9:41</span>
        <div style="display:flex; align-items:center; gap:7px; color:#11151b;">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.7l1.2-1.3C14.4 1.4 11.6.2 8.5.2S2.6 1.4.5 3.6l1.2 1.3C3.5 3.2 5.9 2.2 8.5 2.2z" opacity=".9"/><path d="M8.5 5.6c1.6 0 3.1.6 4.2 1.7l1.2-1.3C12.5 4.6 10.6 3.8 8.5 3.8S4.5 4.6 3.1 6l1.2 1.3C5.4 6.2 6.9 5.6 8.5 5.6z" opacity=".9"/><circle cx="8.5" cy="9.8" r="1.8"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.8" y="2.8" width="17" height="7.4" rx="1.6" fill="currentColor"/><rect x="24" y="4.2" width="1.8" height="4.6" rx=".9" fill="currentColor" opacity=".5"/></svg>
        </div>
      </div>

      <!-- Logo -->
      <div style="flex:none; padding:20px 36px 4px; display:flex; justify-content:center;">
        <div style="width:230px; height:118px; border-radius:30px; background:#ffffff; display:flex; align-items:center; justify-content:center;">
          <img src="assets/iqs-logo.jpeg" alt="IQS" style="width:176px; height:auto; mix-blend-mode:multiply;">
        </div>
      </div>

      <!-- Welcome text -->
      <div style="flex:none; padding:14px 38px 0; text-align:center;">
        <h1 style="margin:0; font-size:28px; font-weight:800; color:#1f8a45; letter-spacing:-.2px;">مرحباً بك في <span style="font-family:'Tajawal',sans-serif;">IQS</span></h1>
        <p style="margin:10px 0 0; font-size:15px; font-weight:500; color:#7d8a82; line-height:1.5;">وجهتك الأولى لكل ما يخص الرياضة العراقية</p>
      </div>

      <!-- Buttons -->
      <div style="flex:none; padding:22px 30px 0; display:flex; flex-direction:column; gap:16px;">

        <!-- Primary: login -->
        <a href="IQS-Home.dc.html" style="position:relative; width:100%; height:66px; box-sizing:border-box; text-decoration:none; border:none; border-radius:22px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:19px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#34a85a 0%,#1f8a45 55%,#19773b 100%); box-shadow:0 12px 22px -6px rgba(25,119,59,.55), 0 6px 0 0 #135c2c, inset 0 2px 1px rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.18); transition:transform .08s ease, box-shadow .08s ease;" style-active="transform:translateY(5px); box-shadow:0 6px 12px -6px rgba(25,119,59,.5), 0 1px 0 0 #135c2c, inset 0 2px 1px rgba(255,255,255,.4), inset 0 -2px 5px rgba(0,0,0,.2);">
          <span style="position:relative; z-index:1;">تسجيل الدخول</span>
          <span style="position:absolute; right:12px; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; background:linear-gradient(180deg,#2a9c52,#15722f); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.3), 0 3px 6px rgba(0,0,0,.2);">

          </span>
        </a>
        <button style="position:relative; width:100%; height:66px; border:none; border-radius:22px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:19px; font-weight:700; color:#1f8a45; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#ffffff 0%,#f1f6f2 100%); border:2px solid #2f9e52; box-shadow:0 10px 20px -10px rgba(31,138,69,.28), inset 0 2px 2px rgba(255,255,255,.9), inset 0 -2px 4px rgba(31,138,69,.08); transition:transform .08s ease, box-shadow .08s ease;" style-active="transform:scale(.985); box-shadow:0 6px 14px -10px rgba(31,138,69,.28), inset 0 2px 4px rgba(31,138,69,.1), inset 0 -2px 3px rgba(255,255,255,.8);">
          <span style="position:relative; z-index:1;">إنشاء حساب جديد</span>
          <span style="position:absolute; right:12px; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; background:linear-gradient(180deg,#ffffff,#eef4ef); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 2px 2px rgba(255,255,255,.9), inset 0 -3px 5px rgba(31,138,69,.12), 0 3px 6px rgba(31,138,69,.12);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f8a45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="8" cy="7" r="3.2"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          </span>
        </button>
      </div>

      <!-- Social -->
      <div style="flex:none; padding:20px 30px 0; text-align:center; position:relative; z-index:2;">
        <p style="margin:0 0 16px; font-size:14px; font-weight:500; color:#9aa69f;">تسجيل الدخول كـ</p>
        <div style="display:flex; align-items:center; justify-content:center; gap:24px;">

            <svg width="26" height="26" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.3 4.7 29.4 2.7 24 2.7 12.3 2.7 2.7 12.3 2.7 24S12.3 45.3 24 45.3 45.3 35.7 45.3 24c0-1.2-.1-2.3-.3-3.5z"/><path fill="#FF3D00" d="M5.3 14.7l6.6 4.8C13.7 15.1 18.5 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.3 4.7 29.4 2.7 24 2.7 16.3 2.7 9.7 7 5.3 14.7z"/><path fill="#4CAF50" d="M24 45.3c5.3 0 10.1-2 13.7-5.3l-6.3-5.3c-2.1 1.5-4.8 2.4-7.4 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 41 16.2 45.3 24 45.3z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.3 5.3c-.4.4 6.7-4.9 6.7-14.8 0-1.2-.1-2.3-.3-3.5z"/></svg>
          </button>

          <button style="width:62px; height:62px; border:none; border-radius:50%; cursor:pointer; background:radial-gradient(120% 120% at 35% 25%,#ffffff 0%,#f3f6f3 100%); border:1.5px solid rgba(31,80,48,.09); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(31,80,48,.16), 0 2px 6px rgba(31,80,48,.1), 0 -2px 6px rgba(31,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -3px 6px rgba(31,80,48,.08); transition:transform .12s ease, box-shadow .12s ease;" style-active="transform:scale(.94); box-shadow:0 3px 8px rgba(31,80,48,.14), inset 0 2px 4px rgba(31,80,48,.12), inset 0 -2px 3px rgba(255,255,255,.8);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#11151b"><path d="M17.05 12.5c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.1-2.02-3.77-2.04-1.6-.16-3.13.94-3.94.94-.81 0-2.07-.92-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.82 3.15-.46 7.82 1.3 10.38.86 1.25 1.88 2.66 3.22 2.61 1.29-.05 1.78-.83 3.34-.83 1.56 0 2 .83 3.37.81 1.39-.03 2.27-1.28 3.12-2.54.98-1.46 1.39-2.87 1.41-2.94-.03-.01-2.71-1.04-2.74-4.13zM14.54 4.6c.71-.87 1.2-2.07 1.06-3.27-1.03.04-2.27.69-3.01 1.55-.66.76-1.24 1.99-1.08 3.16 1.15.09 2.32-.58 3.03-1.44z"/></svg>
          </button>

          <button style="width:62px; height:62px; border:none; border-radius:50%; cursor:pointer; background:radial-gradient(120% 120% at 35% 25%,#ffffff 0%,#f3f6f3 100%); border:1.5px solid rgba(31,80,48,.09); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(31,80,48,.16), 0 2px 6px rgba(31,80,48,.1), 0 -2px 6px rgba(31,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -3px 6px rgba(31,80,48,.08); transition:transform .12s ease, box-shadow .12s ease;" style-active="transform:scale(.94); box-shadow:0 3px 8px rgba(31,80,48,.14), inset 0 2px 4px rgba(31,80,48,.12), inset 0 -2px 3px rgba(255,255,255,.8);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
          </button>
        </div>
      </div>

      <!-- spacer -->
      <div style="flex:1 1 auto; min-height:60px;"></div>

      <!-- Bottom field image, anchored to screen bottom -->
      <img src="assets/footer-field.png" alt="" style="position:absolute; bottom:0; left:0; width:100%; height:auto; display:block; pointer-events:none; z-index:0;">

    </div>

    <!-- Notch -->
    <div style="position:absolute; top:13px; left:50%; transform:translateX(-50%); width:150px; height:30px; background:#11131a; border-radius:0 0 18px 18px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:472,&quot;height&quot;:900}}"></script>
</body>
</html>
