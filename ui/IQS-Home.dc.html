<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  .iqs-scroll::-webkit-scrollbar { display: none; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; font-family:'Tajawal',sans-serif; background:linear-gradient(160deg,#56b277 0%,#3f9e63 55%,#2f8a52 100%);">

  <!-- Phone bezel -->
  <div style="position:relative; width:392px; height:820px; border-radius:56px; padding:13px; background:linear-gradient(145deg,#11131a,#2b2f3a); box-shadow:0 40px 80px -20px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.05) inset;">

    <!-- Screen -->
    <div dir="rtl" style="position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#eef3ee; display:flex; flex-direction:column;">

      <!-- Scroll area -->
      <div class="iqs-scroll" style="flex:1 1 auto; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none; background:#eef3ee;">

        <!-- ===== GREEN HEADER ===== -->
        <div style="position:relative; padding-bottom:18px; border-radius:0 0 36px 36px; overflow:hidden; background:linear-gradient(165deg,#42a967 0%,#319457 55%,#23823f 100%); box-shadow:0 14px 30px -10px rgba(28,90,50,.45);">

          <!-- ball watermark -->
          <svg viewBox="0 0 100 100" style="position:absolute; top:40px; left:-30px; width:170px; height:170px; opacity:.08; pointer-events:none;"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M50 24 L62 33 L57 48 L43 48 L38 33 Z M50 24 L74 28 M62 33 L70 56 M43 48 L30 56 M38 33 L26 28 M74 28 L80 44 L70 56 M26 28 L20 44 L30 56 M30 56 L37 72 L50 70 L63 72 L70 56" fill="none" stroke="#fff" stroke-width="2.2"/></svg>

          <!-- Status bar -->
          <div dir="ltr" style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:16px 30px 4px;">
            <span style="font-size:16px; font-weight:700; color:#fff; letter-spacing:.5px;">9:41</span>
            <div style="display:flex; align-items:center; gap:7px; color:#fff;">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.7l1.2-1.3C14.4 1.4 11.6.2 8.5.2S2.6 1.4.5 3.6l1.2 1.3C3.5 3.2 5.9 2.2 8.5 2.2z"/><path d="M8.5 5.6c1.6 0 3.1.6 4.2 1.7l1.2-1.3C12.5 4.6 10.6 3.8 8.5 3.8S4.5 4.6 3.1 6l1.2 1.3C5.4 6.2 6.9 5.6 8.5 5.6z"/><circle cx="8.5" cy="9.8" r="1.8"/></svg>
              <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="2.8" y="2.8" width="17" height="7.4" rx="1.6" fill="currentColor"/><rect x="24" y="4.2" width="1.8" height="4.6" rx=".9" fill="currentColor" opacity=".55"/></svg>
            </div>
          </div>

          <!-- Top row -->
          <div style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:8px 22px 0;">
            <button style="width:50px; height:50px; border:none; border-radius:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#4cb472,#2c8a4f); box-shadow:0 8px 16px -5px rgba(0,0,0,.35), 0 -2px 6px rgba(255,255,255,.12), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -4px 7px rgba(0,0,0,.25); transition:transform .1s ease;" style-active="transform:scale(.92);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>

            <div style="display:flex; align-items:center; gap:8px;">
              <h1 style="margin:0; font-size:23px; font-weight:800; color:#fff;">مرحباً بك</h1>
              <span style="font-size:22px;">👋</span>
            </div>

            <button style="position:relative; width:50px; height:50px; border:none; border-radius:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#4cb472,#2c8a4f); box-shadow:0 8px 16px -5px rgba(0,0,0,.35), 0 -2px 6px rgba(255,255,255,.12), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -4px 7px rgba(0,0,0,.25); transition:transform .1s ease;" style-active="transform:scale(.92);">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span style="position:absolute; top:11px; right:12px; width:9px; height:9px; border-radius:50%; background:#ffd23d; border:2px solid #2c8a4f;"></span>
            </button>
          </div>

          <!-- Subtitle -->
          <p style="position:relative; margin:12px 0 0; text-align:center; font-size:14px; font-weight:500; color:rgba(255,255,255,.92);">تابع أخر أخبار الرياضة العراقية</p>
        </div>

        <!-- ===== FEATURED SLIDER ===== -->
        <div style="margin:18px 18px 0;">
          <div style="position:relative; border-radius:26px; overflow:hidden; background:#0c2a17; box-shadow:0 20px 36px -10px rgba(20,70,40,.4), 0 8px 16px -6px rgba(20,70,40,.22), 0 -3px 10px rgba(20,70,40,.05), inset 0 2px 3px rgba(255,255,255,.18);">

            <!-- track -->
            <div style="position:relative; height:320px; overflow:hidden;">
              <div style="display:flex; height:100%; transition:transform .55s cubic-bezier(.4,0,.2,1); transform:{{ trackTransform }};">
                <sc-for list="{{ slides }}" as="s" hint-placeholder-count="5">
                  <div style="position:relative; flex:0 0 100%; height:100%;">
                    <img data-src="{{ s.img }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#0c2a17;">
                    <div style="position:absolute; inset:0; background:linear-gradient(180deg,rgba(8,30,16,.05) 30%,rgba(8,30,16,.55) 62%,rgba(8,30,16,.92) 100%);"></div>
                    <div style="position:absolute; top:16px; left:16px; padding:8px 16px; border-radius:14px; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(180deg,#2aa153,#1d8040); box-shadow:0 6px 12px -3px rgba(0,0,0,.4), inset 0 2px 2px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.2);">خبر رئيسي</div>
                    <h2 style="position:absolute; right:22px; bottom:22px; left:22px; margin:0; text-align:right; font-size:25px; font-weight:800; color:#fff; line-height:1.45; text-shadow:0 2px 8px rgba(0,0,0,.6); text-wrap:pretty;">{{ s.title }}</h2>
                  </div>
                </sc-for>
              </div>
            </div>

            <!-- dots -->
            <div style="position:absolute; bottom:12px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:7px;">
              <sc-for list="{{ dots }}" as="d" hint-placeholder-count="5">
                <span onClick="{{ d.go }}" style="height:8px; width:{{ d.w }}; border-radius:99px; cursor:pointer; background:{{ d.bg }}; box-shadow:0 1px 3px rgba(0,0,0,.4); transition:all .35s ease;"></span>
              </sc-for>
            </div>
          </div>
        </div>

        <!-- ===== SECTIONS ===== -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding:24px 24px 14px;">
          <h3 style="margin:0; font-size:18px; font-weight:800; color:#1c2620;">أقسام التطبيق</h3>
          <a href="#" style="font-size:13px; font-weight:700; color:#1f8a45; text-decoration:none;">عرض الكل</a>
        </div>

        <div style="display:flex; gap:12px; padding:0 18px;">
          <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:9px;">
              <button style="width:100%; aspect-ratio:1/1; border:none; border-radius:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#ffffff,#f1f6f2); border:1px solid rgba(31,128,64,.08); box-shadow:0 14px 26px -8px rgba(28,80,48,.2), 0 6px 12px -4px rgba(28,80,48,.12), 0 -3px 9px rgba(28,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -5px 9px rgba(28,80,48,.06); transition:transform .12s ease, box-shadow .12s ease;" style-active="transform:translateY(4px) scale(.97); box-shadow:0 6px 12px -6px rgba(28,80,48,.2), inset 0 2px 4px rgba(28,80,48,.1), inset 0 -2px 4px rgba(255,255,255,.8);">
                <span style="color:#1f8a45; display:flex;" data-icon="{{ sec.icon }}"></span>
              </button>
              <span style="font-size:13px; font-weight:700; color:#33433a;">{{ sec.label }}</span>
            </div>
          </sc-for>
        </div>

        <!-- ===== LATEST NEWS ===== -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding:26px 24px 14px;">
          <h3 style="margin:0; font-size:18px; font-weight:800; color:#1c2620;">أحدث الأخبار</h3>
          <a href="IQS News.dc.html" style="font-size:13px; font-weight:700; color:#1f8a45; text-decoration:none;">عرض الكل</a>
        </div>

        <div style="display:flex; flex-direction:column; gap:14px; padding:0 18px 10px;">
          <sc-for list="{{ news }}" as="n" hint-placeholder-count="2">
            <a href="IQS News.dc.html" style="display:flex; gap:14px; align-items:center; text-decoration:none; background:linear-gradient(180deg,#ffffff,#fafdfb); border-radius:22px; padding:12px; cursor:pointer; border:1px solid rgba(31,128,64,.08); box-shadow:0 14px 28px -10px rgba(28,80,48,.18), 0 6px 12px -4px rgba(28,80,48,.1), 0 -3px 10px rgba(28,80,48,.04), inset 0 2px 3px rgba(255,255,255,.95), inset 0 -4px 9px rgba(28,80,48,.05); transition:transform .12s ease;" style-active="transform:scale(.985);">
              <div style="flex:1; min-width:0; text-align:right;">
                <p style="margin:0 0 9px; font-size:16px; font-weight:800; color:#1c2620; line-height:1.5; text-wrap:pretty;">{{ n.title }}</p>
                <span style="font-size:13px; font-weight:500; color:#9aa69f;">{{ n.time }}</span>
              </div>
              <img data-src="{{ n.img }}" alt="" style="width:108px; height:84px; object-fit:cover; border-radius:16px; flex:none; background:#dfe7e0; box-shadow:0 5px 10px rgba(0,0,0,.18);">
            </a>
          </sc-for>
        </div>

        <div style="height:16px;"></div>
      </div>

      <!-- ===== BOTTOM NAV ===== -->
      <div style="flex:none; display:flex; align-items:flex-end; justify-content:space-around; padding:14px 14px 22px; background:#ffffff; box-shadow:0 -10px 26px -12px rgba(28,80,48,.2);">

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:7px; font-family:'Tajawal',sans-serif;">
          <span style="width:54px; height:46px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#2aa153,#1d8040); box-shadow:0 10px 16px -5px rgba(29,128,64,.55), 0 -2px 6px rgba(29,128,64,.15), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -4px 6px rgba(0,0,0,.18);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          </span>
          <span style="font-size:12px; font-weight:700; color:#1f8a45;">الرئيسية</span>
        </button>

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v3a6 6 0 0 1-12 0z"/><path d="M6 5H4a2 2 0 0 0 0 4h2M18 5h2a2 2 0 0 1 0 4h-2"/><path d="M12 13v3M9 20h6M10 20v-2.5h4V20"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">المباريات</span>
        </button>

        <a href="IQS News.dc.html" style="border:none; cursor:pointer; text-decoration:none; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الأخبار</span>
        </a>

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9aa69f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><polygon points="10 9 15 12 10 15" fill="#9aa69f" stroke="none"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">الفيديو</span>
        </button>

        <button style="border:none; cursor:pointer; background:none; display:flex; flex-direction:column; align-items:center; gap:9px; font-family:'Tajawal',sans-serif; padding-bottom:4px;" style-active="transform:translateY(2px);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#9aa69f"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          <span style="font-size:12px; font-weight:600; color:#9aa69f;">المزيد</span>
        </button>
      </div>

    </div>

    <!-- Notch -->
    <div style="position:absolute; top:13px; left:50%; transform:translateX(-50%); width:150px; height:30px; background:#11131a; border-radius:0 0 18px 18px; z-index:5;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:472,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { slide: 0 };

  slideData = [
    { img: "https://picsum.photos/seed/iqsfeat1/780/520", title: "الزوراء يتفوق على القوة الجوية في ديربي بغداد" },
    { img: "https://picsum.photos/seed/iqsfeat2/780/520", title: "المنتخب العراقي يستعد لتصفيات كأس العالم" },
    { img: "https://picsum.photos/seed/iqsfeat3/780/520", title: "الشرطة يخطف الفوز من أربيل في اللحظات الأخيرة" },
    { img: "https://picsum.photos/seed/iqsfeat4/780/520", title: "نفط الوسط يتعاقد مع مهاجم برازيلي جديد" },
    { img: "https://picsum.photos/seed/iqsfeat5/780/520", title: "انطلاق الدوري الممتاز بمواجهات نارية" },
  ];

  sectionData = [
    { label: "الأخبار",   icon: "news" },
    { label: "المباريات", icon: "trophy" },
    { label: "الفيديو",   icon: "play" },
    { label: "الفرق",     icon: "teams" },
  ];

  newsData = [
    { img: "https://picsum.photos/seed/iqsnews1/320/240", title: "الشرطة يخطف الفوز من أربيل في اللحظات الأخيرة", time: "منذ 2 ساعة" },
    { img: "https://picsum.photos/seed/iqsnews2/320/240", title: "المنتخب العراقي يستعد لتصفيات كأس العالم", time: "منذ 5 ساعات" },
  ];

  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState(s => ({ slide: (s.slide + 1) % this.slideData.length }));
    }, 3800);
    this.paintIcons();
    this.paintImages();
  }
  componentDidUpdate() { this.paintIcons(); this.paintImages(); }

  paintImages() {
    document.querySelectorAll('[data-src]').forEach(el => {
      const u = el.getAttribute('data-src') || '';
      if (u.startsWith('http') && el.getAttribute('src') !== u) el.setAttribute('src', u);
    });
  }
  componentWillUnmount() { clearInterval(this.timer); }

  paintIcons() {
    const svgs = {
      news:   '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="13" y2="17"/></svg>',
      trophy: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4.5a2 2 0 0 0 0 4H7M17 5h2.5a2 2 0 0 1 0 4H17"/><path d="M12 13v3M8.5 20h7M9.5 20v-2.5h5V20"/></svg>',
      play:   '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><polygon points="10 9 15 12 10 15" fill="currentColor" stroke="none"/></svg>',
      teams:  '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2a4.6 4.6 0 0 1 5 4.8"/></svg>',
    };
    const root = this._dcRoot || document;
    (root.querySelectorAll ? root : document).querySelectorAll('[data-icon]').forEach(el => {
      const k = el.getAttribute('data-icon');
      if (svgs[k] && el.innerHTML.trim() === '') el.innerHTML = svgs[k];
    });
  }

  renderVals() {
    const i = this.state.slide;
    return {
      slides: this.slideData,
      sections: this.sectionData,
      news: this.newsData,
      trackTransform: `translateX(${i * 100}%)`,
      dots: this.slideData.map((_, k) => ({
        w: k === i ? "24px" : "8px",
        bg: k === i ? "#ffffff" : "rgba(255,255,255,.5)",
        go: () => this.setState({ slide: k }),
      })),
    };
  }
}
</script>
</body>
</html>
